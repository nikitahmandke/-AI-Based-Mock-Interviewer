<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Upload Resume </title>
<link href="data:image/x-icon;base64," rel="icon" type="image/x-icon"/>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com" rel="preconnect"/>
<link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect"/>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;700;800&amp;display=swap" rel="stylesheet"/>
<script>
    tailwind.config = {
      darkMode: "class",
      theme: {
        extend: {
          colors: {
            "primary": "#4913ec",
            "background-light": "#f6f6f8",
            "background-dark": "#151022",
          },
          fontFamily: {
            "display": ["Manrope"]
          },
          borderRadius: {
            "DEFAULT": "0.5rem",
            "lg": "1rem",
            "xl": "1.5rem",
            "full": "9999px"
          },
        },
      },
    }
</script>
<style>
    .gradient-border {
      position: relative;
      background-clip: padding-box;
      border: 2px solid transparent;
    }
    .gradient-border::before {
      content: '';
      position: absolute;
      top: 0; right: 0; bottom: 0; left: 0;
      z-index: -1;
      margin: -2px; 
      border-radius: inherit; 
      background: linear-gradient(to right, #43a4e8, #22d3ee);
    }
    .gradient-progress {
        background: linear-gradient(to right, #43a4e8, #22d3ee);
    }
</style>
</head>
<body class="font-display bg-background-light dark:bg-background-dark">
<div class="flex flex-col min-h-screen">
<header class="bg-background-light/80 dark:bg-background-dark/80 backdrop-blur-sm sticky top-0 z-20">
<div class="container mx-auto px-4 sm:px-6 lg:px-8">
<div class="flex items-center justify-between h-16">
<div class="flex items-center gap-4">
<div class="text-primary w-8 h-8">
<svg fill="none" viewBox="0 0 48 48" xmlns="http://www.w3.org/2000/svg"><path d="M36.7273 44C33.9891 44 31.6043 39.8386 30.3636 33.69C29.123 39.8386 26.7382 44 24 44C21.2618 44 18.877 39.8386 17.6364 33.69C16.3957 39.8386 14.0109 44 11.2727 44C7.25611 44 4 35.0457 4 24C4 12.9543 7.25611 4 11.2727 4C14.0109 4 16.3957 8.16144 17.6364 14.31C18.877 8.16144 21.2618 4 24 4C26.7382 4 29.123 8.16144 30.3636 14.31C31.6043 8.16144 33.9891 4 36.7273 4C40.7439 4 44 12.9543 44 24C44 35.0457 40.7439 44 36.7273 44Z" fill="currentColor"></path></svg>
</div>
<h1 class="text-xl font-bold text-gray-900 dark:text-white">CareerCoach AI</h1>
</div>
<nav class="hidden md:flex items-center gap-8 text-sm font-medium">
<a class="hover:text-primary transition-colors" href="{{ url_for('dashboard') }}">Home</a>
<a class="hover:text-primary transition-colors" href="{{ url_for('pyqs') }}">PYQs</a>
<a class="hover:text-primary transition-colors" href="{{ url_for('history') }}">History</a>
<a class="hover:text-primary transition-colors" href="{{ url_for('pricing') }}">Pricing</a>
<a class="hover:text-primary transition-colors" href="{{ url_for('contact') }}">Contact</a>
<a class="hover:text-primary transition-colors" href="{{ url_for('about') }}">About</a>
</nav>
</div>
</div>
</header>
<main class="flex-grow container mx-auto px-4 sm:px-6 lg:px-8 py-16">
<div class="max-w-4xl mx-auto flex flex-col items-center text-center">
<h2 class="text-4xl md:text-5xl font-bold text-gray-900 dark:text-white tracking-tight">Upload Your Resume</h2>
<p class="mt-4 text-lg text-gray-600 dark:text-gray-300">We'll use it to tailor your mock interview questions and provide personalized feedback.</p>
<div class="w-full max-w-2xl mt-12">

<!-- Upload form -->
<form action="{{ url_for('upload') }}" method="POST" enctype="multipart/form-data" class="relative group">
  <div class="absolute -inset-2.5 group-hover:-inset-3.5 transition-all duration-300 transform-gpu bg-gradient-to-r from-blue-400 to-teal-400 rounded-xl blur-lg opacity-50 group-hover:opacity-75"></div>
  <div class="relative gradient-border rounded-xl bg-background-light dark:bg-background-dark p-8 flex flex-col items-center justify-center text-center space-y-6">
    
    <!-- Upload Icon -->
    <div class="relative w-40 h-40">
      <div class="absolute inset-0 bg-white dark:bg-gray-800 rounded-lg shadow-md transform rotate-6 transition-transform duration-300 group-hover:rotate-3"></div>
      <div class="absolute inset-0 bg-white dark:bg-gray-800 rounded-lg shadow-md transform -rotate-6 transition-transform duration-300 group-hover:-rotate-3"></div>
      <div class="absolute inset-0 bg-white dark:bg-gray-800 rounded-lg shadow-lg flex items-center justify-center">
        <svg class="w-16 h-16 text-primary" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
          <path d="M9 12h6m-6 4h6m2 5H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z" stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5"></path>
        </svg>
      </div>
    </div>

    <p class="text-xl font-bold text-gray-900 dark:text-white">Drag and drop your resume</p>
    <p class="text-gray-500 dark:text-gray-400">or</p>

    <!-- Updated file input -->
    <label class="bg-primary/10 dark:bg-primary/20 text-primary font-semibold py-2 px-6 rounded-lg hover:bg-primary/20 dark:hover:bg-primary/30 transition-colors cursor-pointer">
      Browse Files
      <input id="fileInput" type="file" name="resume" 
             accept=".pdf,.doc,.docx" 
             class="hidden" onchange="showFileName()" required />
    </label>

    <!-- Show selected filename -->
    <p id="fileName" class="text-sm text-gray-600 dark:text-gray-400"></p>

    <button type="submit" class="mt-4 px-6 py-2 bg-primary text-white rounded-lg font-bold hover:opacity-90 transition-opacity">
      Get Started
    </button>
  </div>
</form>

</div>
</main>
</div>

<script>
  function showFileName() {
    const input = document.getElementById("fileInput");
    const label = document.getElementById("fileName");
    if (input.files.length > 0) {
      label.textContent = "Selected: " + input.files[0].name;
    }
  }
</script>
</body>
</html>
